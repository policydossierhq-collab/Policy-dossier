<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Dossier — Nigeria first. Then the world.</title>
<meta name="description" content="Nigerian and global policy news, summarised and filed as it breaks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--fg:#f5f5f5;--mute:#8f8f8f;--line:#262626;--ng:#2ecc71}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--surface:#fff;--fg:#0a0a0a;--mute:#666;--line:#dcdad4;--ng:#0b7a3b}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-weight:900;font-size:30px;letter-spacing:-.07em;line-height:1}
.brand span{font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.sp{flex:1}
.search{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 16px;font:500 14px Archivo,sans-serif;width:min(240px,40vw)}
.search::placeholder{color:var(--mute)}
.xbtn{font-weight:700;font-size:14px;background:var(--fg);color:var(--bg);border-radius:999px;padding:9px 18px;white-space:nowrap}
.xbtn:hover{opacity:.85}

/* masthead */
.mast{padding-top:56px;padding-bottom:28px}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.mast h1{font-weight:900;font-size:clamp(44px,9vw,104px);line-height:.92;letter-spacing:-.055em;margin:14px 0 0;max-width:12ch}
.mast h1 em{font-style:normal;color:var(--ng)}
.mast p{color:var(--mute);max-width:48ch;margin:18px 0 0;font-size:17px}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 24px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;font:600 14px Archivo,sans-serif;color:var(--fg);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--fg)}
.pill[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* stories */
.tag{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tag i{font-style:normal;color:var(--ng)}
.tag i::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ng);margin-right:6px}
.img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line);border-radius:10px}
.ph{aspect-ratio:16/9;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:44px;letter-spacing:-.07em;color:var(--line)}
.time{color:var(--mute);font-size:13px}
.lead{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center;padding:28px 0 40px;border-top:1px solid var(--fg)}
.lead h2{font-weight:900;font-size:clamp(28px,4.4vw,48px);line-height:1.04;letter-spacing:-.035em;margin:14px 0}
.lead p{color:var(--mute);font-size:18px;margin:0 0 16px}
.lead:hover h2,.card:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 28px;padding-top:32px;border-top:1px solid var(--line)}
.card{display:flex;flex-direction:column;gap:12px}
.card h3{font-weight:800;font-size:21px;line-height:1.18;letter-spacing:-.02em;margin:0}
.card p{color:var(--mute);font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:80px 0;text-align:center;color:var(--mute)}
.empty b{display:block;font-weight:900;font-size:72px;letter-spacing:-.07em;color:var(--line)}
.skel{height:260px;border-radius:10px;background:linear-gradient(90deg,var(--surface),var(--line),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}html{scroll-behavior:auto}}

footer{border-top:1px solid var(--line);margin-top:72px;padding:32px 0 48px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
@media(max-width:760px){.sp{display:none}.search{flex:1;width:auto;min-width:0}.xbtn{padding:9px 14px}.lead{grid-template-columns:1fr;gap:18px}.brand span{display:none}.mast{padding-top:36px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./" aria-label="Policy Dossier home"><b>PD</b><span>Policy Dossier</span></a>
  <div class="sp"></div>
  <input class="search" id="q" type="search" placeholder="Search stories" aria-label="Search stories">
  <a class="xbtn" id="xlink" href="https://x.com/YOUR_HANDLE" target="_blank" rel="noopener">Follow on X</a>
</div></header>

<section class="wrap mast">
  <div class="eyebrow" id="today"></div>
  <h1>Nigeria first. <em>Then</em> the world.</h1>
  <p>Policy, politics and the economy from trusted outlets, summarised and filed the moment it breaks.</p>
</section>

<main class="wrap">
  <nav class="filters" id="filters" aria-label="Filter stories"></nav>
  <div id="feed" aria-live="polite"><div class="skel"></div></div>
</main>

<footer><div class="wrap">
  <span>© Policy Dossier. Summaries are written automatically. Always read the original source.</span>
  <a href="https://x.com/YOUR_HANDLE" id="xfoot" target="_blank" rel="noopener">Follow us on X →</a>
</div></footer>

<script>
const X_URL = "https://x.com/YOUR_HANDLE"; // set your X page here
document.getElementById("xlink").href = document.getElementById("xfoot").href = X_URL;
document.getElementById("today").textContent = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
let stories = [], active = "All", term = "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return m + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
}
const tag = s => `<span class="tag">${s.region === "Nigeria" ? "<i>Nigeria</i>" : "World"}<span>${esc(s.source)}</span></span>`;
const pic = s => s.image
  ? `<img class="img" src="${esc(s.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=ph>PD</div>'">`
  : `<div class="ph">PD</div>`;
const href = s => `stories/${esc(s.id)}.html`;
function render(){
  const t = term.toLowerCase();
  const list = stories.filter(s => (active === "All" || s.source === active || s.region === active)
    && (!t || (s.title + " " + s.summary).toLowerCase().includes(t)));
  const feed = document.getElementById("feed");
  if (!list.length) {
    feed.innerHTML = `<div class="empty"><b>PD</b>${stories.length ? "No stories match that." : "No stories filed yet. The next automatic update will fill this page."}</div>`;
    return;
  }
  const [a, ...rest] = list;
  feed.innerHTML = `
    <a class="lead" href="${href(a)}">
      ${pic(a)}
      <div>${tag(a)}<h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><span class="time">${ago(a.published)}</span></div>
    </a>
    <div class="grid">${rest.map(s => `
      <a class="card" href="${href(s)}">${pic(s)}${tag(s)}<h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p><span class="time">${ago(s.published)}</span></a>`).join("")}</div>`;
}
function filters(){
  const names = ["All", "Nigeria", "World", ...new Set(stories.map(s => s.source))];
  const nav = document.getElementById("filters");
  nav.innerHTML = names.map(n => `<button class="pill" aria-pressed="${n === active}" data-n="${esc(n)}">${esc(n)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { active = b.dataset.n; filters(); render(); });
}
document.getElementById("q").oninput = e => { term = e.target.value; render(); };
fetch("stories.json", {cache:"no-cache"}).then(r => r.json()).then(d => { stories = d; })
  .catch(() => {}).finally(() => { filters(); render(); });
</script>
</body>
</html>
