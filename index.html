<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Policy Dossier</title>

<meta
    name="description"
    content="Clear coverage of policy, public affairs and current affairs."
>

<link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Source+Serif+4:wght@400;600&display=swap"
    rel="stylesheet"
>

<style>

:root {
    --bg:#090909;
    --surface:#151515;
    --fg:#f5f5f5;
    --mute:#8e8e8e;
    --line:#292929;
    --accent:#087a3b;
}

@media (prefers-color-scheme:light) {

    :root {
        --bg:#f7f6f2;
        --surface:#fff;
        --fg:#0a0a0a;
        --mute:#696969;
        --line:#ddd9d2;
        --accent:#087a3b;
    }
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:Archivo,system-ui,sans-serif;
}

a {
    color:inherit;
    text-decoration:none;
}

header {
    border-bottom:1px solid var(--line);
}

.nav {
    width:min(1180px,calc(100% - 40px));
    height:72px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand {
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark {
    font-size:32px;
    font-weight:900;
    letter-spacing:-.09em;
}

.brand-name {
    font-size:13px;
    font-weight:800;
    letter-spacing:.2em;
    text-transform:uppercase;
}

.x-link {
    color:var(--mute);
    font-size:14px;
    font-weight:600;
}

main {
    width:min(1180px,calc(100% - 40px));
    margin:0 auto;
    padding:48px 0 80px;
}

.intro {
    padding-bottom:34px;
    margin-bottom:34px;
    border-bottom:1px solid var(--line);
}

.eyebrow {
    color:var(--accent);
    margin-bottom:10px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
}

.intro h1 {
    max-width:800px;
    margin:0;
    font-size:clamp(42px,8vw,78px);
    line-height:.96;
    letter-spacing:-.06em;
    font-weight:900;
}

.intro p {
    max-width:650px;
    margin:18px 0 0;
    color:var(--mute);
    font:400 18px/1.55 "Source Serif 4",Georgia,serif;
}

.hero {
    display:grid;
    grid-template-columns:1.35fr 1fr;
    gap:30px;
    padding-bottom:38px;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
}

.hero-image {
    display:block;
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    background:var(--surface);
    border-radius:12px;
}

.hero-copy {
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.region {
    color:var(--accent);
    font-size:11px;
    font-weight:800;
    letter-spacing:.17em;
    text-transform:uppercase;
}

.hero h2 {
    margin:11px 0 15px;
    font-size:clamp(30px,4vw,50px);
    line-height:1.04;
    letter-spacing:-.045em;
    font-weight:900;
}

.summary {
    margin:0;
    color:var(--mute);
    font:400 18px/1.55 "Source Serif 4",Georgia,serif;
}

.date {
    margin-top:18px;
    color:var(--mute);
    font-size:12px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.card {
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
}

.card-image {
    display:block;
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    margin-bottom:17px;
    background:var(--surface);
    border-radius:9px;
}

.card h3 {
    margin:9px 0 10px;
    font-size:22px;
    line-height:1.12;
    letter-spacing:-.025em;
    font-weight:800;
}

.card .summary {
    font-size:16px;
}

.empty {
    padding:60px 0;
    color:var(--mute);
    text-align:center;
}

footer {
    border-top:1px solid var(--line);
}

.footer-inner {
    width:min(1180px,calc(100% - 40px));
    margin:0 auto;
    padding:28px 0;
    display:flex;
    justify-content:space-between;
    color:var(--mute);
    font-size:12px;
}

@media (max-width:800px) {

    .hero {
        grid-template-columns:1fr;
    }

    .grid {
        grid-template-columns:1fr;
    }

    .hero h2 {
        font-size:34px;
    }
}

</style>

</head>

<body>

<header>

<div class="nav">

<a
    class="brand"
    href="./"
>

<span class="brand-mark">
PD
</span>

<span class="brand-name">
Policy Dossier
</span>

</a>

<a
    class="x-link"
    href="https://x.com/Policydossier"
    target="_blank"
    rel="noopener"
>
Follow on X
</a>

</div>

</header>


<main>

<section class="intro">

<div class="eyebrow">
Policy · Public Affairs · Current Affairs
</div>

<h1>
Policy Dossier
</h1>

<p>
Clear, concise coverage of developments shaping Nigeria and the wider world.
</p>

</section>


<div id="content">

<div class="empty">
Loading latest stories…
</div>

</div>

</main>


<footer>

<div class="footer-inner">

<span>
© Policy Dossier
</span>

<a
    href="https://x.com/Policydossier"
    target="_blank"
    rel="noopener"
>
@Policydossier
</a>

</div>

</footer>


<script>

const content =
    document.getElementById(
        "content"
    );


function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


function storyURL(story) {

    return (
        `stories/${encodeURIComponent(
            story.id
        )}.html`
    );
}


function imageHTML(
    story,
    className
) {

    if (!story.image) {
        return "";
    }

    return `
        <img
            class="${className}"
            src="${escapeHTML(story.image)}"
            alt="${escapeHTML(story.title)}"
            loading="lazy"
            onerror="this.remove()"
        >
    `;
}


function dateText(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }


    return date.toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}


function render(stories) {

    if (
        !Array.isArray(stories)
        || stories.length === 0
    ) {

        content.innerHTML = `
            <div class="empty">
                No stories available yet.
            </div>
        `;

        return;
    }


    const hero =
        stories[0];


    const remaining =
        stories.slice(
            1
        );


    const heroHTML = `

        <a
            class="hero"
            href="${storyURL(hero)}"
        >

            <div>
                ${imageHTML(
                    hero,
                    "hero-image"
                )}
            </div>

            <div class="hero-copy">

                <div class="region">
                    ${escapeHTML(
                        hero.region || "World"
                    )}
                </div>

                <h2>
                    ${escapeHTML(
                        hero.title
                    )}
                </h2>

                <p class="summary">
                    ${escapeHTML(
                        hero.summary || ""
                    )}
                </p>

                <div class="date">
                    ${escapeHTML(
                        dateText(
                            hero.published
                        )
                    )}
                </div>

            </div>

        </a>
    `;


    const cards = remaining
        .map(
            story => `

                <a
                    class="card"
                    href="${storyURL(story)}"
                >

                    ${imageHTML(
                        story,
                        "card-image"
                    )}

                    <div class="region">
                        ${escapeHTML(
                            story.region || "World"
                        )}
                    </div>

                    <h3>
                        ${escapeHTML(
                            story.title
                        )}
                    </h3>

                    <p class="summary">
                        ${escapeHTML(
                            story.summary || ""
                        )}
                    </p>

                    <div class="date">
                        ${escapeHTML(
                            dateText(
                                story.published
                            )
                        )}
                    </div>

                </a>
            `
        )

        .join("");


    content.innerHTML = `

        ${heroHTML}

        <section class="grid">
            ${cards}
        </section>
    `;
}


fetch(
    `stories.json?v=${Date.now()}`
)

.then(
    response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load stories."
            );
        }

        return response.json();
    }
)

.then(
    render
)

.catch(
    error => {

        console.error(
            error
        );

        content.innerHTML = `
            <div class="empty">
                Unable to load stories right now.
            </div>
        `;
    }
);

</script>

</body>

</html>
